services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pickupland
      POSTGRES_USER: pickupland
      POSTGRES_PASSWORD: change-me
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
